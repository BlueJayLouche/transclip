name: Release

# Builds the Mac app and, for a v* tag, attaches it to a GitHub release.
#   macOS (Apple Silicon) -> Transclip.app in a .dmg (ad-hoc signed)
#
# A manual run builds the same package as a downloadable artifact and publishes nothing.
# Windows and Linux are not packaged yet: CI runs the app end to end on both on every push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}

  build:
    name: macOS package
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Package
        run: |
          [ "$(uname -m)" = arm64 ]  # the bundled uv, and so the app, is for the chip it is built on
          version=0.0.0
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          ./package-macos.sh "$version"
          mkdir out
          hdiutil create -volname Transclip -srcfolder dist/Transclip.app -ov -format UDZO out/transclip-macos-arm64.dmg
          hdiutil verify out/transclip-macos-arm64.dmg
      # From the bundle alone: its own uv fetches Python and the libraries, as on a first launch.
      - name: The packaged app starts, answers and quits
        run: |
          export TRANSCLIP_HOME="$RUNNER_TEMP/home"
          dist/Transclip.app/Contents/MacOS/Transclip --no-open
          for _ in $(seq 1 120); do curl -sf -m 2 -o /dev/null http://127.0.0.1:8790/api/ping && break; sleep 2; done
          curl -sf http://127.0.0.1:8790/api/library
          curl -sf -X POST http://127.0.0.1:8790/api/quit
          codesign --verify --deep --strict dist/Transclip.app
          cat "$HOME/Library/Logs/Transclip.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transclip-macos-arm64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY"
          --title "Transclip ${GITHUB_REF_NAME#v}" --generate-notes
